<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>生日快乐 · xiao黎</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;1,400&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --blush:   #F2C4C4;
      --rose:    #D97B8A;
      --peach:   #F7E0D0;
      --cream:   #FDF6EF;
      --brown:   #7A4F4F;
      --gold:    #C9956B;
    }

    html, body {
      width: 100%; height: 100%;
      overflow-x: hidden;
    }

    body {
      background: var(--cream);
      font-family: 'Noto Serif SC', serif;
      color: var(--brown);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Canvas for petals ── */
    #petal-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Main card ── */
    .card {
      position: relative;
      z-index: 1;
      width: min(420px, 92vw);
      margin: 8vh auto 6vh;
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(8px);
      border-radius: 28px;
      padding: 48px 36px 52px;
      box-shadow:
        0 4px 32px rgba(217,123,138,0.13),
        0 1px 4px rgba(201,149,107,0.08);
      text-align: center;
      animation: floatIn 1.2s cubic-bezier(.22,1,.36,1) both;
    }

    @keyframes floatIn {
      from { opacity: 0; transform: translateY(36px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Decorative top ornament ── */
    .ornament {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 30px;
    }
    .ornament-line {
      width: 48px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--blush));
    }
    .ornament-line.right {
      background: linear-gradient(90deg, var(--blush), transparent);
    }
    .ornament-flower {
      font-size: 22px;
      animation: spinSlow 8s linear infinite;
    }
    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* ── Name ── */
    .name-label {
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 6px;
    }
    .name {
      font-family: 'Playfair Display', 'Noto Serif SC', serif;
      font-size: clamp(34px, 10vw, 46px);
      font-weight: 400;
      font-style: italic;
      color: var(--rose);
      line-height: 1.15;
      margin-bottom: 22px;
      text-shadow: 0 2px 16px rgba(217,123,138,0.18);
      animation: fadeUp 1.4s 0.3s cubic-bezier(.22,1,.36,1) both;
    }

    /* ── Divider ── */
    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 0 auto 22px;
      width: 80%;
    }
    .div-line {
      flex: 1; height: 1px;
      background: var(--blush);
    }
    .div-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--rose); }

    /* ── Birthday headline ── */
    .headline {
      font-size: clamp(20px, 5.5vw, 26px);
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--brown);
      margin-bottom: 20px;
      animation: fadeUp 1.4s 0.5s cubic-bezier(.22,1,.36,1) both;
    }

    /* ── Wish text ── */
    .wish {
      font-size: clamp(16px, 4.2vw, 19px);
      font-weight: 300;
      color: var(--gold);
      line-height: 1.9;
      letter-spacing: 0.04em;
      margin-bottom: 36px;
      animation: fadeUp 1.4s 0.7s cubic-bezier(.22,1,.36,1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Candle row ── */
    .candles {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-bottom: 32px;
    }
    .candle {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      animation: fadeUp 1.4s 0.9s cubic-bezier(.22,1,.36,1) both;
    }
    .flame {
      font-size: 22px;
      animation: flicker 1.4s ease-in-out infinite alternate;
    }
    .candle:nth-child(2) .flame { animation-delay: 0.2s; }
    .candle:nth-child(3) .flame { animation-delay: 0.4s; }
    @keyframes flicker {
      from { transform: scaleY(1)   rotate(-3deg); opacity: 0.9; }
      to   { transform: scaleY(1.1) rotate(3deg);  opacity: 1; }
    }
    .stick {
      width: 10px; height: 40px;
      background: linear-gradient(180deg, var(--blush), var(--rose));
      border-radius: 5px 5px 3px 3px;
    }

    /* ── Bottom stamp ── */
    .stamp {
      font-size: 11px;
      letter-spacing: 0.18em;
      color: var(--blush);
    }

    /* ── Heart burst on tap ── */
    .heart-burst {
      position: fixed;
      font-size: 24px;
      pointer-events: none;
      z-index: 999;
      animation: burst 0.9s ease-out forwards;
    }
    @keyframes burst {
      0%   { opacity: 1; transform: scale(0.5) translateY(0); }
      100% { opacity: 0; transform: scale(1.4) translateY(-60px); }
    }
  </style>
</head>
<body>

<canvas id="petal-canvas"></canvas>

<div class="card">
  <div class="ornament">
    <div class="ornament-line"></div>
    <div class="ornament-flower">🌸</div>
    <div class="ornament-line right"></div>
  </div>

  <div class="name-label">Happy Birthday to</div>
  <div class="name">xiao黎</div>

  <div class="divider">
    <div class="div-line"></div>
    <div class="div-dot"></div>
    <div class="div-line"></div>
  </div>

  <div class="headline">生日快乐 🎂</div>

  <div class="wish">
    祝你越来越漂亮<br>
    愿每一天都温柔以待 🌷
  </div>

  <div class="candles">
    <div class="candle"><div class="flame">🔥</div><div class="stick"></div></div>
    <div class="candle"><div class="flame">🔥</div><div class="stick"></div></div>
    <div class="candle"><div class="flame">🔥</div><div class="stick"></div></div>
  </div>

  <div class="stamp">✦ &nbsp; 专属祝福 &nbsp; ✦</div>
</div>

<script>
// ── Falling petals ──
const canvas = document.getElementById('petal-canvas');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const PETAL_EMOJIS = ['🌸','🌺','🌷','✿','❀'];
const petals = Array.from({ length: 28 }, () => ({
  x: Math.random() * window.innerWidth,
  y: Math.random() * -window.innerHeight,
  size: 14 + Math.random() * 14,
  speed: 0.6 + Math.random() * 1.0,
  drift: (Math.random() - 0.5) * 0.7,
  spin: (Math.random() - 0.5) * 0.04,
  angle: Math.random() * Math.PI * 2,
  emoji: PETAL_EMOJIS[Math.floor(Math.random() * PETAL_EMOJIS.length)],
  opacity: 0.55 + Math.random() * 0.45,
}));

function drawPetals() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  petals.forEach(p => {
    ctx.save();
    ctx.globalAlpha = p.opacity;
    ctx.translate(p.x, p.y);
    ctx.rotate(p.angle);
    ctx.font = `${p.size}px serif`;
    ctx.fillText(p.emoji, -p.size / 2, p.size / 2);
    ctx.restore();
    p.y += p.speed;
    p.x += p.drift;
    p.angle += p.spin;
    if (p.y > canvas.height + 20) {
      p.y = -20;
      p.x = Math.random() * canvas.width;
    }
  });
  requestAnimationFrame(drawPetals);
}
drawPetals();

// ── Heart burst on tap/click ──
document.addEventListener('click', e => {
  const el = document.createElement('div');
  el.className = 'heart-burst';
  el.textContent = ['💕','🌸','💖','✨'][Math.floor(Math.random()*4)];
  el.style.left = (e.clientX - 16) + 'px';
  el.style.top  = (e.clientY - 16) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 900);
});
</script>
</body>
</html>
